name: Publish UsefulWrong

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: usefulwrong-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Validate public release
        run: python3 tools/verify_site.py site
      - name: Verify interactive models
        run: node --test tests/*.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
